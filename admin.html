<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>एडमिन पैनल | जनहुंकार न्यूज़</title><link rel="stylesheet" href="/style.css"><style>.wrap{max-width:900px;margin:24px auto;padding:0 18px}.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:18px}.panel h2{margin-top:0}.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.full{grid-column:1/-1}label{font-weight:600;font-size:14px}input,select,textarea{font:inherit;padding:10px;border:1px solid #cfd3da;border-radius:7px;width:100%;background:white}textarea{min-height:120px}.primary{background:var(--red);border:0;color:white;border-radius:7px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer}.status{background:#f3f4f6;padding:10px;border-radius:7px;margin:10px 0}.hidden{display:none!important}.item{border-bottom:1px solid var(--line);padding:13px 0;display:flex;justify-content:space-between;gap:12px}.item small{color:var(--muted)}.danger{background:white;border:1px solid #ddd;padding:7px;border-radius:6px;cursor:pointer}.logout{margin-top:12px;padding:8px;border:1px solid #ddd;background:white;border-radius:6px}@media(max-width:600px){.form{grid-template-columns:1fr}.full{grid-column:auto}.item{flex-direction:column}}</style></head><body><div class="top">जनहुंकार न्यूज़ <span><a href="/" style="color:white">वेबसाइट देखें ↗</a></span></div><header><div class="logo">ज</div><div><h1>जनहुंकार <em>न्यूज़</em></h1><p>समाचार प्रबंधन पैनल</p></div></header><main class="wrap">
<section id="login" class="panel"><h2>एडमिन लॉगिन</h2><form id="loginform" class="form"><div class="field"><label>यूज़रनेम</label><input id="username" required autocomplete="username"></div><div class="field"><label>पासवर्ड</label><input id="password" type="password" required autocomplete="current-password"></div><div class="field full"><button class="primary">लॉगिन करें</button></div></form><div id="loginmsg" class="status hidden"></div></section>
<section id="dash" class="hidden"><div class="panel"><h2>नई खबर लिखें</h2><div id="msg" class="status hidden"></div><form id="newsform" class="form" enctype="multipart/form-data"><div class="field full"><label>हेडलाइन *</label><input name="title" required maxlength="180" placeholder="खबर की दमदार और तथ्यात्मक हेडलाइन"></div><div class="field"><label>श्रेणी</label><select name="category"><option>स्थानीय खबर</option><option>घरघोड़ा</option><option>रायगढ़</option><option>छत्तीसगढ़</option><option>राजनीति</option><option>शिक्षा</option><option>जनसमस्या</option><option>अपराध</option><option>रोजगार</option><option>खेल</option></select></div><div class="field"><label>स्थान</label><input name="location" value="घरघोड़ा"></div><div class="field full"><label>खबर का संक्षेप *</label><textarea name="summary" required maxlength="400"></textarea></div><div class="field full"><label>पूरी खबर *</label><textarea name="body" required></textarea></div><div class="field"><label>रिपोर्टर का नाम</label><input name="author" value="Alisha Panda" required></div><div class="field"><label>खबर की फोटो (अधिकतम 5 MB)</label><input name="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></div><div class="field full"><label><input name="published" type="checkbox" value="true" checked style="width:auto"> अभी प्रकाशित करें</label></div><div class="field full"><button class="primary">खबर सेव / प्रकाशित करें</button></div></form></div><div class="panel"><h2>सभी खबरें</h2><div id="list">लोड हो रहा है…</div><button id="logout" class="logout">लॉगआउट</button></div></section></main><script src="/admin.js"></script></body></html>
